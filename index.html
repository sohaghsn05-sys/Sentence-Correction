        question: "They could not help _____ the car on the road, where it had broken down.",
        options: ["A. unless", "B. but", "C. than", "D. Instead of"],

        explanation: "'Cannot help but + base verb' (or 'cannot help + V-ing') is the standard idiomatic structure meaning unable to avoid doing something."
      },
      {

        bookNo: "03",

        tag: "DU: 21-22, A",

        explanation: "Third Conditional structure: 'If + Past Perfect (had taken), subject + would/could/might + have + V3 (wouldn't have missed)'."

      {
        id: 5,
        bookNo: "05",
        uni: "DU",
        tag: "DU: 20-21, A",

        explanation: "'Because of' is a prepositional phrase showing cause before a noun phrase ('his alert and vigilant presence')."
      },
      {
        id: 6,
        bookNo: "06",
        uni: "DU",
        tag: "DU: 20-21, A",
        question: "Complete the following sentence: \"If I had a car, _____\"",

          "C. I would have taken you to a long drive.",
          "D. I would take you to a long drive."

        answer: 3,
        explanation: "Second Conditional: 'If + Simple Past (had), subject + would + base verb (take)'."
      },
      {
        id: 7,
        bookNo: "08",
        uni: "DU",
        tag: "DU: 17-18, A",
        question: "Choose the correct sentence regarding punctuation:",
        options: [
          "A. He used the phrase you know so often that I finally said, No, I don't know.",

        ],
        answer: 3,
        explanation: "Quoted phrases ('\"you know\"') and direct speech ('\"No, I don't know.\"') both require quotation marks, with a comma after introductory 'No'."
      },
      {
        id: 8,
        bookNo: "09",
        uni: "DU",
        tag: "DU: 16-17, A",
        question: "Which sentence is grammatically correct?",
        options: [
          "A. Who do the book belongs to?",
          "B. Who belongs to the book?",
          "C. Who does the book belong to?",
          "D. To whom does the book belong to?"
        ],
        answer: 2,
        explanation: "Singular subject 'the book' takes 'does' + base verb 'belong'. Option D is redundant because it repeats 'to'."
      },
      {
        id: 9,
        bookNo: "10",
        uni: "DU",
        tag: "DU: 12-13, A",
        question: "Choose the correct sentence:",

          "B. It is you who are to leave.",
          "C. It is you who is late.",
          "D. It is you who has won the prize."
        ],
        answer: 1,
        explanation: "A relative pronoun ('who') takes a verb agreeing with its antecedent ('you' -> plural verb 'are')."
      },
      {
        id: 10,
        bookNo: "12",
        uni: "DU",
        tag: "DU: 12-13, A",
        question: "Choose the correct sentence:",

          "B. The jury is arguing among themselves.",
          "C. The jury has argued among themselves.",

        answer: 0,
        explanation: "Collective nouns like 'jury' take a plural verb ('are') and plural pronoun ('themselves') when members act individually/dividedly."

      {

        bookNo: "15",

        tag: "DU: 10-11, A",

        options: [

          "C. One of the problems is extremely easy to solve.",
          "D. One of the problem's are extremely easy to solve."

        answer: 2,
        explanation: "'One of + plural noun (problems) + singular verb (is)'."
      },
      {
        id: 12,
        bookNo: "23",
        uni: "DU",
        tag: "DU: 08-09, A",
        question: "No grammatical error occurs in:",

          "B. I wasn't eating since breakfast.",
          "C. I hadn't been eating since breakfast.",
          "D. I haven't eaten since breakfast."
        ],
        answer: 3,
        explanation: "Actions starting in the past ('since breakfast') and continuing up to the present require Present Perfect ('haven't eaten')."
      },
      {

        bookNo: "38",
        uni: "DU",
        tag: "DU: 04-05, A",
        question: "Choose the correct sentence:",

          "B. more he gets, the more he wants.",
          "C. The more he gets, more he wants.",
          "D. The more he gets, the more he wants."

        answer: 3,
        explanation: "Double comparative parallel structure requires 'The + comparative..., the + comparative...'."

      {
        id: 16,
        bookNo: "45",
        uni: "DU",
        tag: "DU: 18-19, D",

          "C. No sooner had the police see the thief then they started chasing him",
          "D. No sooner the police had seen the thief then they started chasing him"

        answer: 0,

      {

        bookNo: "53",
        uni: "DU",
        tag: "DU: 14-15, D",
        question: "Which of the following sentences is correct?",

          "B. I insist that she comes along.",
          "C. I insist that she come along.",
          "D. I insist that she may come along."

        explanation: "Present Subjunctive Mood: Verbs of demand/insistence ('insist that') are followed by the base form of the verb ('come') regardless of subject."

        bookNo: "60",
        uni: "DU",

            desc: "Followed by Subject + Simple Past tense to indicate overdue action.",
            example: "It's about time we left; it's nearly midnight. [CU 13-14]"
          }
        ]
      },
      {
        category: "Gerund vs. Infinitive",
        badge: "Must Memorize",
        rules: [
          {
            title: "Prepositional 'to' + Gerund (V-ing)",
            desc: "Phrases ending in preposition 'to' require V-ing: look forward to, committed to, addicted to, be used to, with a view to.",
            example: "I am committed to pursuing a career in management. [DU 21-22]"
          },
          {
            title: "Cannot help / Feel like / Stop",
            desc: "Followed directly by a Gerund (V-ing) or 'cannot help but + V1'.",
            example: "I can't help laughing. [RU 14-15] / The wind stopped blowing. [JnU 12-13]"
          },
          {
            title: "Causative & Bare Infinitives",
            desc: "Let / make / help (active) + object + base verb. Note: 'need not' also takes base verb without 'to'.",
            example: "Let him and me go. [RU 15-16] / He need not wait for me. [CU 10-11]"
          }
        ]
      },
      {
        category: "Dangling Modifiers & Parallelism",
        badge: "BUET / IBA Favorite",
        rules: [
          {
            title: "Dangling Participle Rule",
            desc: "An introductory participial phrase (-ing / -ed) must logically describe the subject immediately following the comma.",
            example: "Flying out of the window, the papers were grabbed by him. [BUET 20-21]"
          },
          {
            title: "Logical Comparison (that of / those of)",
            desc: "Compare like with like. Do not compare a quality or object directly to a person or place.",
            example: "Your courage is as great as that of any other person. [DU 12-13]"
          },
          {
            title: "Double Comparatives",
            desc: "Both clauses must start with 'The + comparative adjective/adverb'.",
            example: "The more he gets, the more he wants. [DU 04-05]"
          }
        ]
      },
      {
        category: "Fixed Prepositions & Inversion",
        badge: "Quick Marks",
        rules: [
          {
            title: "Latin Comparatives (-ior) & Prefer",
            desc: "Senior, junior, superior, inferior, prior, and prefer take 'to' (never 'than').",
            example: "He is senior to me. [JnU 11-12] / I prefer death to dishonor. [RU 09-10]"
          },
          {
            title: "Negative Inversion & No Sooner",
            desc: "Starting with Never, Hardly, Rarely, or No sooner requires auxiliary inversion before the subject.",
            example: "No sooner had the police seen the thief than they started chasing him. [DU 18-19]"
          },
          {
            title: "Embedded Questions",
            desc: "Wh-clauses inside a question follow statement word order (Subject + Verb), not question inversion.",
            example: "Do you know where he lives? [DU 00-01]"
          }
        ]
      }
    ];

    /**
     * =========================================================================
     * APPLICATION STATE & LOCALSTORAGE PERSISTENCE
     * =========================================================================
     */
    const STORAGE_KEY = "retina_sentence_correction_state_v1";

    const defaultState = {
      mode: "practice", // 'practice' | 'exam' | 'review' | 'rules'
      selectedUni: "ALL",
      searchQuery: "",
      currentPage: 1,
      itemsPerPage: 10,
      answered: {}, // { [questionId]: { selected: number, isCorrect: boolean } }
      bookmarks: [], // [questionId, ...]
      mistakes: [], // [questionId, ...]
      exam: {
        active: false,
        finished: false,
        questions: [],
        answers: {}, // { [index]: optionIndex }
        timeLeft: 15 * 60, // 15 minutes for 20 questions
        negativeMarking: true,
        timerInterval: null
      }
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(defaultState),
          answered: parsed.answered || {},
          bookmarks: Array.isArray(parsed.bookmarks) ? parsed.bookmarks : [],
          mistakes: Array.isArray(parsed.mistakes) ? parsed.mistakes : [],
        };
      } catch (err) {
        console.error("Failed to load state:", err);
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      try {
        const payload = {
          answered: state.answered,
          bookmarks: state.bookmarks,
          mistakes: state.mistakes,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {
        console.error("Failed to save state:", err);
      }
    }

    /**
     * =========================================================================
     * UI HELPERS (TOAST & CUSTOM CONFIRM MODAL)
     * =========================================================================
     */
    let toastTimeout = null;
    function showToast(msg) {
      const box = document.getElementById("toastBox");
      const text = document.getElementById("toastMessage");
      text.textContent = msg;
      box.classList.remove("opacity-0", "translate-y-3");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        box.classList.add("opacity-0", "translate-y-3");
      }, 2400);
    }

    function showConfirm(title, body, onConfirm) {
      const modal = document.getElementById("confirmModal");
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmBody").textContent = body;
      modal.classList.remove("hidden");
      modal.classList.add("flex");

      const cancelBtn = document.getElementById("confirmCancelBtn");
      const acceptBtn = document.getElementById("confirmAcceptBtn");

      const cleanup = () => {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
        cancelBtn.onclick = null;
        acceptBtn.onclick = null;
      };

      cancelBtn.onclick = cleanup;
      acceptBtn.onclick = () => {
        cleanup();
        onConfirm();
      };
    }

    /**
     * =========================================================================
     * HEADER METRICS & FILTER BAR RENDERING
     * =========================================================================
     */
    const UNIVERSITIES = ["ALL", "DU", "BUET", "JnU", "JU", "RU", "CU", "KU", "BU"];

    function updateHeaderStats() {
      const entries = Object.values(state.answered);
      const correct = entries.filter((e) => e.isCorrect).length;
      const wrong = entries.filter((e) => !e.isCorrect).length;
      const total = correct + wrong;
      const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;

      document.getElementById("desktopCorrectCount").textContent = correct;
      document.getElementById("desktopWrongCount").textContent = wrong;
      document.getElementById("desktopAccuracy").textContent = `${accuracy}%`;

      document.getElementById("mobileCorrectCount").textContent = `${correct}✓`;
      document.getElementById("mobileWrongCount").textContent = `${wrong}✗`;

      const reviewSet = new Set([...state.bookmarks, ...state.mistakes]);
      document.getElementById("reviewBadgeCount").textContent = reviewSet.size;
    }

    function renderUniFilters() {
      const container = document.getElementById("uniFilterContainer");
      container.innerHTML = UNIVERSITIES.map((uni) => {
        const count =
          uni === "ALL"
            ? QUESTIONS_DB.length
            : QUESTIONS_DB.filter((q) => q.uni === uni).length;
        const isActive = state.selectedUni === uni;
        return `
          <button
            onclick="selectUniversity('${uni}')"

                ? "bg-purple-600/25 border-purple-500 text-purple-200 shadow-sm shadow-purple-500/20"

            }"
          >
            <span>${uni === "ALL" ? "All Units" : uni}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-md ${
              isActive ? "bg-purple-500 text-white" : "bg-white/5 text-gray-400"
            }">${count}</span>
          </button>
        `;
      }).join("");
    }

    function updateModeTabs() {
      document.querySelectorAll(".mode-tab").forEach((btn) => {
        const isMatch = btn.dataset.mode === state.mode;
        if (isMatch) {
          btn.className =
            "mode-tab flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-purple-600 text-white shadow-md shadow-purple-600/25 whitespace-nowrap flex items-center justify-center gap-1.5";
        } else {
          btn.className =
            "mode-tab flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition-all whitespace-nowrap flex items-center justify-center gap-1.5";

      });

    /**
     * =========================================================================
     * QUESTION CARD COMPONENT (REUSED IN PRACTICE & REVIEW TABS)
     * =========================================================================
     */
    function buildQuestionCardHTML(q, displayIndex) {
      const userAnswer = state.answered[q.id];
      const isBookmarked = state.bookmarks.includes(q.id);
      const isMistake = state.mistakes.includes(q.id);

      const optionsHTML = q.options
        .map((optText, idx) => {
          let btnClasses =
            "option-btn w-full text-left px-4 py-3 rounded-xl border text-xs sm:text-sm font-medium flex items-center justify-between gap-3 ";
          let statusIcon = "";

          if (!userAnswer) {
            btnClasses += "bg-[#111118]/90 border-white/10 text-gray-200 cursor-pointer";
          } else {
            const isCorrectOpt = idx === q.answer;
            const isSelectedOpt = idx === userAnswer.selected;

            if (isCorrectOpt) {
              btnClasses += "bg-emerald-500/15 border-emerald-500/70 text-emerald-200 font-semibold";
              statusIcon = `<span class="shrink-0 w-5 h-5 rounded-full bg-emerald-500 text-black flex items-center justify-center text-xs font-extrabold">✓</span>`;
            } else if (isSelectedOpt && !userAnswer.isCorrect) {
              btnClasses += "bg-rose-500/15 border-rose-500/70 text-rose-200";
              statusIcon = `<span class="shrink-0 w-5 h-5 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs font-extrabold">✗</span>`;
            } else {
              btnClasses += "bg-[#111118]/40 border-white/5 text-gray-500 opacity-70";
            }
          }

          return `
            <button
              type="button"
              ${userAnswer ? "disabled" : `onclick="handlePracticeAnswer(${q.id}, ${idx})"`}
              class="${btnClasses}"
            >
              <span>${optText}</span>
              ${statusIcon}
            </button>
          `;
        })
        .join("");

      const explanationHTML = userAnswer
        ? `
          <div class="mt-4 p-4 rounded-xl bg-purple-950/35 border border-purple-500/30 animate-fade-in">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[11px] font-extrabold uppercase tracking-wider ${
                userAnswer.isCorrect ? "text-emerald-400" : "text-purple-300"
              }">
                ${userAnswer.isCorrect ? "Correct! Grammar Rule:" : "Explanation & Grammar Rule:"}
              </span>
            </div>
            <p class="text-xs sm:text-[13px] text-gray-200 leading-relaxed">${q.explanation}</p>
          </div>
        `
        : "";

      return `
        <article class="glass-panel glass-card-hover rounded-2xl p-5 sm:p-6 animate-fade-in" id="q-card-${q.id}">
          <!-- Card Top Metadata -->
          <div class="flex items-center justify-between gap-2 mb-3.5">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg bg-purple-600/20 border border-purple-500/30 text-purple-300 text-[11px] font-extrabold">
                #${q.bookNo}
              </span>
              <span class="px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-gray-300 text-[11px] font-semibold">
                [${q.tag}]
              </span>
              ${
                isMistake
                  ? `<span class="px-2 py-0.5 rounded-md bg-rose-500/15 border border-rose-500/30 text-rose-300 text-[10px] font-bold">Needs Review</span>`
                  : ""
              }
            </div>

            <div class="flex items-center gap-1.5">
              ${
                userAnswer
                  ? `<button onclick="retrySingleQuestion(${q.id})" title="Try this question again" class="px-2.5 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white text-[11px] font-semibold transition-colors">
                      Retry
                    </button>`
                  : ""
              }
              <button
                onclick="toggleBookmark(${q.id})"
                title="${isBookmarked ? "Remove Bookmark" : "Bookmark Question"}"
                class="p-2 rounded-xl border transition-all ${
                  isBookmarked
                    ? "bg-amber-500/20 border-amber-500/50 text-amber-300"
                    : "bg-white/5 border-white/10 text-gray-400 hover:text-amber-300"
                }"
              >
                <svg class="w-4 h-4" fill="${isBookmarked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Question Stem -->
          <h2 class="text-sm sm:text-base font-bold text-white leading-snug mb-4">
            ${q.question}
          </h2>

          <!-- Options Grid -->
          <div class="grid grid-cols-1 gap-2.5">
            ${optionsHTML}
          </div>

          <!-- Instant Feedback Explanation -->
          ${explanationHTML}
        </article>
      `;
    }

    /**
     * =========================================================================
     * VIEW 1: PRACTICE MODE
     * =========================================================================
     */
    function getFilteredQuestions() {
      return QUESTIONS_DB.filter((q) => {
        const matchesUni = state.selectedUni === "ALL" || q.uni === state.selectedUni;
        const query = state.searchQuery.trim().toLowerCase();
        if (!query) return matchesUni;
        const cleanQuery = query.replace(/^#/, "");
        return (
          matchesUni &&
          (q.question.toLowerCase().includes(query) ||
            q.tag.toLowerCase().includes(query) ||
            q.bookNo.toLowerCase().includes(cleanQuery) ||
            q.options.some((o) => o.toLowerCase().includes(query)))
        );
      });
    }

    function renderPracticeMode() {
      const container = document.getElementById("appContainer");
      const filtered = getFilteredQuestions();
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.itemsPerPage));
      if (state.currentPage > totalPages) state.currentPage = totalPages;

      const startIdx = (state.currentPage - 1) * state.itemsPerPage;
      const pageItems = filtered.slice(startIdx, startIdx + state.itemsPerPage);

      // Progress bar for current filter
      const answeredInFilter = filtered.filter((q) => state.answered[q.id]).length;
      const pct = filtered.length > 0 ? Math.round((answeredInFilter / filtered.length) * 100) : 0;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="glass-panel rounded-2xl p-10 text-center">
            <p class="text-base font-bold text-white mb-1">No matching questions found</p>
            <p class="text-xs text-gray-400 mb-4">Try clearing your search keyword or switching to "All Units".</p>
            <button onclick="clearFilters()" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white transition-colors">
              Reset Filters
            </button>
          </div>
        `;
        return;
      }

      const cardsHTML = pageItems.map((q, i) => buildQuestionCardHTML(q, startIdx + i + 1)).join("");

      container.innerHTML = `
        <!-- Progress Overview Bar -->
        <div class="glass-panel rounded-2xl p-4 mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex-1">
            <div class="flex items-center justify-between text-xs font-semibold mb-1.5">
              <span class="text-gray-300">
                ${state.selectedUni === "ALL" ? "All Universities" : state.selectedUni + " Question Bank"} Progress
              </span>
              <span class="text-purple-300 font-bold">${answeredInFilter} / ${filtered.length} Solved (${pct}%)</span>
            </div>
            <div class="w-full h-2 rounded-full bg-white/5 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-purple-600 to-fuchsia-500 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>
          </div>
          <div class="text-[11px] text-gray-400 font-medium sm:text-right">
            Showing <span class="text-white font-bold">${startIdx + 1}-${Math.min(startIdx + state.itemsPerPage, filtered.length)}</span> of ${filtered.length}
          </div>
        </div>

        <!-- Question List -->
        <div class="space-y-4">
          ${cardsHTML}
        </div>

        <!-- Pagination Controls -->
        <div class="mt-7 flex items-center justify-between glass-panel p-3.5 rounded-2xl">
          <button
            onclick="changePage(${state.currentPage - 1})"
            ${state.currentPage === 1 ? "disabled" : ""}
            class="px-4 py-2 rounded-xl text-xs font-bold border border-white/10 transition-colors ${
              state.currentPage === 1
                ? "opacity-40 cursor-not-allowed text-gray-500"
                : "bg-white/5 hover:bg-purple-600/25 hover:border-purple-500/40 text-white"
            }"
          >
            ← Previous
          </button>

          <div class="flex items-center gap-1.5">
            ${Array.from({ length: totalPages }, (_, i) => i + 1)
              .map(
                (p) => `
                <button
                  onclick="changePage(${p})"
                  class="w-8 h-8 rounded-xl text-xs font-bold transition-all ${
                    p === state.currentPage
                      ? "bg-purple-600 text-white shadow-md shadow-purple-600/30"
                      : "bg-white/5 text-gray-400 hover:text-white"
                  }"
                >
                  ${p}
                </button>
              `
              )
              .join("")}
          </div>

          <button
            onclick="changePage(${state.currentPage + 1})"
            ${state.currentPage === totalPages ? "disabled" : ""}
            class="px-4 py-2 rounded-xl text-xs font-bold border border-white/10 transition-colors ${
              state.currentPage === totalPages
                ? "opacity-40 cursor-not-allowed text-gray-500"
                : "bg-white/5 hover:bg-purple-600/25 hover:border-purple-500/40 text-white"
            }"
          >
            Next →
          </button>
        </div>
      `;
    }

    /**
     * =========================================================================
     * VIEW 2: TIMED EXAM MODE (20 RANDOMIZED QUESTIONS + NEGATIVE MARKING)
     * =========================================================================
     */
    function startExam() {
      const shuffled = [...QUESTIONS_DB].sort(() => Math.random() - 0.5).slice(0, 20);
      state.exam.active = true;
      state.exam.finished = false;
      state.exam.questions = shuffled;
      state.exam.answers = {};
      state.exam.timeLeft = 15 * 60; // 15 mins

      clearInterval(state.exam.timerInterval);
      state.exam.timerInterval = setInterval(() => {
        if (!state.exam.active || state.exam.finished) {
          clearInterval(state.exam.timerInterval);
          return;
        }
        state.exam.timeLeft--;
        const timerEl = document.getElementById("examTimerDisplay");
        if (timerEl) {
          timerEl.textContent = formatTime(state.exam.timeLeft);
          if (state.exam.timeLeft <= 60) {
            timerEl.classList.add("text-rose-400", "animate-pulse");
          }
        }
        if (state.exam.timeLeft <= 0) {
          submitExam(true);
        }
      }, 1000);

      renderExamMode();
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function selectExamOption(qIdx, optIdx) {
      if (state.exam.finished) return;
      state.exam.answers[qIdx] = optIdx;
      renderExamMode();
    }

    function toggleNegativeMarking() {
      state.exam.negativeMarking = !state.exam.negativeMarking;
      renderExamMode();
    }

    function submitExam(auto = false) {
      clearInterval(state.exam.timerInterval);
      state.exam.finished = true;

      // Also log wrong answers into mistakes tracker for study review
      state.exam.questions.forEach((q, idx) => {
        const chosen = state.exam.answers[idx];
        if (chosen !== undefined && chosen !== q.answer) {
          if (!state.mistakes.includes(q.id)) {
            state.mistakes.push(q.id);
          }
        }
      });
      saveState();
      updateHeaderStats();
      if (auto) showToast("Time's up! Exam submitted automatically.");
      renderExamMode();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderExamMode() {
      const container = document.getElementById("appContainer");

      // Pre-exam Lobby Screen
      if (!state.exam.active) {
        container.innerHTML = `
          <div class="glass-panel rounded-3xl p-6 sm:p-10 max-w-2xl mx-auto text-center animate-fade-in border-purple-500/30">
            <div class="w-14 h-14 rounded-2xl bg-purple-600/20 border border-purple-500/40 text-purple-300 flex items-center justify-center mx-auto mb-4">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-white mb-2">Admission Mock Exam</h2>
            <p class="text-xs sm:text-sm text-gray-400 max-w-md mx-auto mb-6 leading-relaxed">
              Simulate real DU, BUET, RU, JU &amp; CU admission test pressure with 20 randomized sentence correction MCQs and a 15-minute countdown.
            </p>

            <div class="grid grid-cols-3 gap-3 max-w-md mx-auto mb-6">
              <div class="bg-[#111118] border border-white/10 p-3 rounded-2xl">
                <div class="text-lg font-extrabold text-white">20</div>
                <div class="text-[11px] text-gray-400 font-medium">Questions</div>
              </div>
              <div class="bg-[#111118] border border-white/10 p-3 rounded-2xl">
                <div class="text-lg font-extrabold text-purple-400">15:00</div>
                <div class="text-[11px] text-gray-400 font-medium">Minutes</div>
              </div>
              <div class="bg-[#111118] border border-white/10 p-3 rounded-2xl">
                <div class="text-lg font-extrabold text-rose-400">${state.exam.negativeMarking ? "-0.25" : "0.00"}</div>
                <div class="text-[11px] text-gray-400 font-medium">Wrong Penalty</div>
              </div>
            </div>

            <!-- Negative Marking Toggle -->
            <div class="flex items-center justify-center gap-3 mb-7">
              <span class="text-xs font-semibold text-gray-300">Standard BD Negative Marking (-0.25):</span>
              <button
                onclick="toggleNegativeMarking()"
                class="w-12 h-6 rounded-full p-1 transition-colors ${
                  state.exam.negativeMarking ? "bg-purple-600" : "bg-gray-700"
                }"
              >
                <div class="w-4 h-4 rounded-full bg-white transition-transform ${
                  state.exam.negativeMarking ? "translate-x-6" : "translate-x-0"
                }"></div>
              </button>
            </div>

            <button
              onclick="startExam()"
              class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-violet-600 hover:from-purple-500 hover:to-violet-500 text-white text-sm font-extrabold shadow-xl shadow-purple-600/30 transition-all"
            >
              Start Mock Exam Now
            </button>
          </div>
        `;
        return;
      }

      // Post-Exam Results & Breakdown Screen
      if (state.exam.finished) {
        let correct = 0;
        let wrong = 0;
        let skipped = 0;

        state.exam.questions.forEach((q, idx) => {
          const chosen = state.exam.answers[idx];
          if (chosen === undefined) skipped++;
          else if (chosen === q.answer) correct++;
          else wrong++;
        });

        const penalty = state.exam.negativeMarking ? wrong * 0.25 : 0;
        const netScore = Math.max(0, correct - penalty).toFixed(2);

        const reviewCards = state.exam.questions
          .map((q, idx) => {
            const chosen = state.exam.answers[idx];
            const isCorrect = chosen === q.answer;
            const statusBadge =
              chosen === undefined
                ? `<span class="px-2.5 py-0.5 rounded-md bg-gray-700/60 text-gray-300 text-[10px] font-bold">Skipped</span>`
                : isCorrect
                ? `<span class="px-2.5 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 text-[10px] font-bold">+1.00 Correct</span>`
                : `<span class="px-2.5 py-0.5 rounded-md bg-rose-500/20 text-rose-300 text-[10px] font-bold">${
                    state.exam.negativeMarking ? "-0.25 Wrong" : "Wrong"
                  }</span>`;

            return `
              <div class="glass-panel rounded-2xl p-5 border ${
                chosen === undefined
                  ? "border-white/10"
                  : isCorrect
                  ? "border-emerald-500/30"
                  : "border-rose-500/30"
              }">
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-extrabold text-purple-300">Q${idx + 1}. [${q.tag}]</span>
                  ${statusBadge}
                </div>
                <p class="text-sm font-bold text-white mb-3">${q.question}</p>
                <div class="space-y-1.5 text-xs mb-3">
                  ${q.options
                    .map((opt, oIdx) => {
                      let style = "px-3 py-2 rounded-xl border border-white/5 text-gray-400";
                      if (oIdx === q.answer) {
                        style = "px-3 py-2 rounded-xl border border-emerald-500/60 bg-emerald-500/15 text-emerald-200 font-bold";
                      } else if (oIdx === chosen && !isCorrect) {
                        style = "px-3 py-2 rounded-xl border border-rose-500/60 bg-rose-500/15 text-rose-200";
                      }
                      return `<div class="${style}">${opt}</div>`;
                    })
                    .join("")}
                </div>
                <p class="text-xs text-purple-200/90 bg-purple-950/40 p-3 rounded-xl border border-purple-500/20">
                  <strong class="text-purple-300">Rule:</strong> ${q.explanation}
                </p>
              </div>
            `;
          })
          .join("");

        container.innerHTML = `
          <div class="glass-panel rounded-3xl p-6 sm:p-8 mb-6 border-purple-500/35 animate-fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-white/10">
              <div>
                <span class="text-xs font-extrabold uppercase tracking-wider text-purple-400">Exam Completed</span>
                <h2 class="text-2xl font-extrabold text-white mt-0.5">Performance Breakdown</h2>
              </div>
              <button
                onclick="startExam()"
                class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-extrabold text-white shadow-lg shadow-purple-600/25 transition-all"
              >
                Take Another Mock Test
              </button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6">
              <div class="bg-[#111118] border border-purple-500/30 p-4 rounded-2xl">
                <div class="text-2xl font-extrabold text-purple-400">${netScore} <span class="text-xs text-gray-500">/ 20</span></div>
                <div class="text-xs text-gray-400 font-semibold mt-1">Net Score</div>
              </div>
              <div class="bg-[#111118] border border-emerald-500/25 p-4 rounded-2xl">
                <div class="text-2xl font-extrabold text-emerald-400">${correct}</div>
                <div class="text-xs text-gray-400 font-semibold mt-1">Correct (+${correct})</div>
              </div>
              <div class="bg-[#111118] border border-rose-500/25 p-4 rounded-2xl">
                <div class="text-2xl font-extrabold text-rose-400">${wrong}</div>
                <div class="text-xs text-gray-400 font-semibold mt-1">Wrong (-${penalty.toFixed(2)})</div>
              </div>
              <div class="bg-[#111118] border border-white/10 p-4 rounded-2xl">
                <div class="text-2xl font-extrabold text-gray-300">${skipped}</div>
                <div class="text-xs text-gray-400 font-semibold mt-1">Unanswered</div>
              </div>
            </div>
          </div>

          <h3 class="text-sm font-extrabold uppercase tracking-wider text-gray-400 mb-3">Detailed Answer Sheet</h3>
          <div class="space-y-4">
            ${reviewCards}
          </div>
        `;
        return;
      }

      // Active Exam In-Progress Screen
      const answeredCount = Object.keys(state.exam.answers).length;
      const examQuestionsHTML = state.exam.questions
        .map((q, idx) => {
          const selectedOpt = state.exam.answers[idx];
          return `
            <div class="glass-panel rounded-2xl p-5">
              <div class="flex items-center justify-between mb-3">
                <span class="px-2.5 py-1 rounded-lg bg-purple-600/20 text-purple-300 text-xs font-extrabold">
                  Question ${idx + 1} of 20
                </span>
                <span class="text-[11px] text-gray-400 font-semibold">[${q.tag}]</span>
              </div>
              <h3 class="text-sm sm:text-base font-bold text-white mb-4">${q.question}</h3>
              <div class="grid grid-cols-1 gap-2">
                ${q.options
                  .map((opt, oIdx) => {
                    const isPicked = selectedOpt === oIdx;
                    return `
                      <button
                        type="button"
                        onclick="selectExamOption(${idx}, ${oIdx})"
                        class="option-btn w-full text-left px-4 py-3 rounded-xl border text-xs sm:text-sm font-medium flex items-center justify-between ${
                          isPicked
                            ? "bg-purple-600/25 border-purple-500 text-white font-bold"
                            : "bg-[#111118]/90 border-white/10 text-gray-300"
                        }"
                      >
                        <span>${opt}</span>
                        <span class="w-4 h-4 rounded-full border flex items-center justify-center ${
                          isPicked ? "border-purple-400 bg-purple-500" : "border-gray-600"
                        }">
                          ${isPicked ? '<span class="w-1.5 h-1.5 rounded-full bg-white"></span>' : ""}
                        </span>
                      </button>
                    `;
                  })
                  .join("")}
              </div>
            </div>
          `;
        })
        .join("");

      container.innerHTML = `
        <!-- Sticky Exam Control Bar -->
        <div class="sticky top-[74px] sm:top-[68px] z-20 glass-panel rounded-2xl p-3.5 mb-5 flex items-center justify-between gap-3 border-purple-500/40 shadow-xl">
          <div class="flex items-center gap-3">
            <div class="px-3 py-1.5 rounded-xl bg-[#0a0a0f] border border-purple-500/30 font-mono text-sm sm:text-base font-extrabold text-purple-300" id="examTimerDisplay">
              ${formatTime(state.exam.timeLeft)}
            </div>
            <div class="text-xs font-semibold text-gray-300">
              Answered: <span class="text-white font-extrabold">${answeredCount}/20</span>
            </div>
          </div>

          <button
            onclick="confirmExamSubmission()"
            class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold shadow-lg shadow-emerald-600/20 transition-all"
          >
            Submit Exam
          </button>
        </div>

        <div class="space-y-4">
          ${examQuestionsHTML}
        </div>
      `;
    }

    function confirmExamSubmission() {
      const answeredCount = Object.keys(state.exam.answers).length;
      showConfirm(
        "Submit Mock Exam?",
        `You have answered ${answeredCount} out of 20 questions. Are you ready to view your final score?`,
        () => submitExam(false)
      );
    }

    /**
     * =========================================================================
     * VIEW 3: BOOKMARKS & MISTAKE REVIEW TAB
     * =========================================================================
     */
    function renderReviewMode() {
      const container = document.getElementById("appContainer");
      const reviewIds = Array.from(new Set([...state.mistakes, ...state.bookmarks]));
      const reviewQuestions = QUESTIONS_DB.filter((q) => reviewIds.includes(q.id));

      if (reviewQuestions.length === 0) {
        container.innerHTML = `
          <div class="glass-panel rounded-3xl p-10 text-center max-w-lg mx-auto animate-fade-in">
            <div class="w-12 h-12 rounded-2xl bg-purple-600/20 text-purple-300 flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
              </svg>
            </div>
            <h2 class="text-lg font-extrabold text-white mb-1">Your Revision Deck is Empty</h2>
            <p class="text-xs text-gray-400 leading-relaxed mb-5">
              Any question you get wrong or bookmark while practicing will automatically appear here for focused revision.
            </p>
            <button onclick="switchMode('practice')" class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white transition-colors">
              Go to Practice Mode
            </button>
          </div>
        `;
        return;
      }

      const cardsHTML = reviewQuestions.map((q, idx) => buildQuestionCardHTML(q, idx + 1)).join("");

      container.innerHTML = `
        <div class="glass-panel rounded-2xl p-4 mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-sm font-extrabold text-white">Saved &amp; Mistake Review (${reviewQuestions.length})</h2>
            <p class="text-xs text-gray-400">
              ${state.mistakes.length} Mistake(s) • ${state.bookmarks.length} Bookmarked
            </p>
          </div>
          <button
            onclick="clearMistakesList()"
            class="px-3.5 py-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-300 text-xs font-bold transition-colors self-start sm:self-auto"
          >
            Clear Mistake History
          </button>
        </div>
        <div class="space-y-4">
          ${cardsHTML}
        </div>
      `;
    }

    /**
     * =========================================================================
     * VIEW 4: GRAMMAR CHEAT-SHEET TAB
     * =========================================================================
     */
    function renderRulesMode() {
      const container = document.getElementById("appContainer");

      const sectionsHTML = GRAMMAR_RULES.map(
        (cat) => `
          <section class="glass-panel rounded-2xl p-5 sm:p-6 animate-fade-in">
            <div class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-white/10">
              <h2 class="text-base sm:text-lg font-extrabold text-white">${cat.category}</h2>
              <span class="px-2.5 py-1 rounded-lg bg-purple-600/20 border border-purple-500/30 text-purple-300 text-[10px] font-extrabold uppercase tracking-wider">
                ${cat.badge}
              </span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${cat.rules
                .map(
                  (r) => `
                  <div class="bg-[#111118]/90 border border-white/10 hover:border-purple-500/35 rounded-xl p-4 transition-colors">
                    <h3 class="text-xs sm:text-sm font-bold text-purple-300 mb-1.5">${r.title}</h3>
                    <p class="text-xs text-gray-300 leading-relaxed mb-2.5">${r.desc}</p>
                    <div class="text-[11px] bg-purple-950/40 border-l-2 border-purple-500 px-3 py-2 rounded-r-lg text-gray-200 font-medium">
                      "${r.example}"
                    </div>
                  </div>
                `
                )
                .join("")}
            </div>
          </section>
        `
      ).join("");

      container.innerHTML = `
        <div class="glass-panel rounded-2xl p-5 mb-5 border-purple-500/30">
          <h2 class="text-base sm:text-lg font-extrabold text-white">RETINA Guide High-Yield Grammar Cheat-Sheet</h2>
          <p class="text-xs text-gray-400 mt-1">
            Core grammatical patterns tested repeatedly across DU, BUET, JnU, JU, RU, CU, KU, and BU admission exams.
          </p>
        </div>
        <div class="space-y-5">
          ${sectionsHTML}
        </div>
      `;
    }

    /**
     * =========================================================================
     * EVENT HANDLERS & CONTROLLER ACTIONS
     * =========================================================================
     */
    function handlePracticeAnswer(questionId, selectedOptionIdx) {
      const q = QUESTIONS_DB.find((item) => item.id === questionId);
      if (!q) return;

      const isCorrect = selectedOptionIdx === q.answer;
      state.answered[questionId] = {
        selected: selectedOptionIdx,
        isCorrect,
      };

      if (!isCorrect && !state.mistakes.includes(questionId)) {
        state.mistakes.push(questionId);
      }

      saveState();
      updateHeaderStats();
      renderCurrentView();
    }

    function retrySingleQuestion(questionId) {
      delete state.answered[questionId];
      saveState();
      updateHeaderStats();
      renderCurrentView();
    }

    function toggleBookmark(questionId) {
      const idx = state.bookmarks.indexOf(questionId);
      if (idx === -1) {
        state.bookmarks.push(questionId);
        showToast("Question bookmarked for revision");
      } else {
        state.bookmarks.splice(idx, 1);
        showToast("Bookmark removed");
      }
      saveState();
      updateHeaderStats();
      renderCurrentView();
    }

    function selectUniversity(uni) {
      state.selectedUni = uni;
      state.currentPage = 1;
      renderUniFilters();
      renderCurrentView();
    }

    function changePage(newPage) {
      state.currentPage = newPage;
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearFilters() {
      state.selectedUni = "ALL";
      state.searchQuery = "";
      state.currentPage = 1;
      document.getElementById("searchInput").value = "";
      renderUniFilters();
      renderCurrentView();
    }

    function clearMistakesList() {
      showConfirm(
        "Clear Mistake History?",
        "This will remove auto-tracked wrong answers from your review list (bookmarked items will remain).",
        () => {
          state.mistakes = [];
          saveState();
          updateHeaderStats();
          renderCurrentView();
          showToast("Mistake history cleared");
        }
      );
    }

    function switchMode(newMode) {
      state.mode = newMode;
      updateModeTabs();
      renderCurrentView();
    }

    function renderCurrentView() {
      if (state.mode === "practice") renderPracticeMode();
      else if (state.mode === "exam") renderExamMode();
      else if (state.mode === "review") renderReviewMode();
      else if (state.mode === "rules") renderRulesMode();
    }

    // Initialize Listeners & First Render
    document.addEventListener("DOMContentLoaded", () => {
      // Mode Tabs
      document.querySelectorAll(".mode-tab").forEach((btn) => {
        btn.addEventListener("click", () => switchMode(btn.dataset.mode));
      });

      // Live Search Input
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        state.currentPage = 1;
        renderPracticeMode();
      });

      // Reset Progress Button
      document.getElementById("resetProgressBtn").addEventListener("click", () => {
        showConfirm(
          "Reset All Practice Progress?",
          "This will clear your answered history and accuracy stats so you can practice fresh.",
          () => {
            state.answered = {};
            saveState();
            updateHeaderStats();
            renderCurrentView();
            showToast("Practice progress reset");
          }
        );
      });

      renderUniFilters();
      updateModeTabs();
      updateHeaderStats();
      renderCurrentView();
    });
  </script>
</body>
</html>
